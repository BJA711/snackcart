<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSev" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </radialGradient>
    <filter id="sevShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgSev)" />

  <!-- Bowl Shadow -->
  <ellipse cx="250" cy="380" rx="170" ry="30" fill="#78350F" opacity="0.12" />

  <!-- Traditional Terracotta / Ceramic Bowl -->
  <path d="M 100 240 C 100 350, 400 350, 400 240 Z" fill="#C04F22" filter="url(#sevShadow)" />
  <ellipse cx="250" cy="240" rx="150" ry="35" fill="#D96B35" />
  <ellipse cx="250" cy="240" rx="142" ry="30" fill="#9D3D1D" />

  <!-- Mountain of Crispy Besan Sev strands -->
  <g fill="none" stroke-linecap="round">
    <!-- Base darker golden strands -->
    <g stroke="#D97706" stroke-width="4.5">
      <path d="M 140 230 Q 180 180 230 200 T 320 190" />
      <path d="M 170 210 Q 210 160 260 170 T 350 200" />
      <path d="M 190 240 Q 250 150 310 180 T 360 220" />
      <path d="M 150 220 Q 220 170 290 190 T 340 210" />
      <path d="M 210 230 Q 260 160 300 200 T 370 230" />
      <path d="M 160 200 Q 240 140 280 170 T 330 210" />
      <path d="M 180 190 Q 230 130 270 160 T 310 220" />
    </g>

    <!-- Mid bright chickpea golden yellow strands -->
    <g stroke="#F59E0B" stroke-width="4">
      <path d="M 150 225 Q 190 170 240 190 T 330 180" />
      <path d="M 165 205 Q 215 150 275 160 T 345 205" />
      <path d="M 180 235 Q 235 140 300 175 T 355 215" />
      <path d="M 195 210 Q 245 135 285 165 T 335 220" />
      <path d="M 175 180 Q 225 120 270 145 T 325 190" />
      <path d="M 205 195 Q 255 125 295 155 T 315 210" />
      <path d="M 220 220 Q 265 155 315 175 T 360 210" />
      <path d="M 140 215 Q 200 165 250 185 T 320 225" />
    </g>

    <!-- Top highlight strands -->
    <g stroke="#FDE68A" stroke-width="3.5">
      <path d="M 190 185 Q 240 120 280 140 T 320 175" />
      <path d="M 210 175 Q 250 110 290 135 T 310 170" />
      <path d="M 175 195 Q 230 135 270 150 T 335 190" />
      <path d="M 225 190 Q 260 125 300 150 T 330 180" />
    </g>
  </g>

  <!-- Crushed Black Pepper & Ajwain specks -->
  <g fill="#292524" opacity="0.8">
    <circle cx="210" cy="180" r="2.5" />
    <circle cx="250" cy="150" r="2" />
    <circle cx="280" cy="165" r="2.5" />
    <circle cx="230" cy="135" r="2" />
    <circle cx="265" cy="125" r="1.8" />
    <circle cx="195" cy="160" r="2.2" />
    <circle cx="305" cy="185" r="2.5" />
    <circle cx="320" cy="205" r="2" />
    <circle cx="240" cy="195" r="2.2" />
    <circle cx="270" cy="180" r="2.5" />
    <circle cx="170" cy="210" r="2" />
  </g>

  <!-- Label Badge -->
  <rect x="150" y="420" width="200" height="34" rx="17" fill="#78350F" />
  <text x="250" y="442" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">SPICED BESAN SEV</text>
</svg>

