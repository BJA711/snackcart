<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMakhana" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F2EBE1" />
    </radialGradient>
    <!-- Foxnut Gradient: Puffed Ivory White with warm toasted base -->
    <radialGradient id="foxnutGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FEF9EE" />
      <stop offset="85%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="makhanaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgMakhana)" />

  <!-- Bowl Shadow -->
  <ellipse cx="250" cy="385" rx="165" ry="30" fill="#78350F" opacity="0.12" />

  <!-- Ceramic Snack Bowl -->
  <path d="M 110 240 C 110 360, 390 360, 390 240 Z" fill="#292524" filter="url(#makhanaShadow)" />
  <ellipse cx="250" cy="240" rx="140" ry="32" fill="#44403C" />
  <ellipse cx="250" cy="240" rx="132" ry="28" fill="#1C1917" />

  <!-- Cluster of Roasted Puffed Foxnuts (Makhana) -->
  <!-- Background row -->
  <circle cx="180" cy="220" r="30" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="235" cy="205" r="32" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="290" cy="210" r="31" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="330" cy="230" r="28" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />

  <!-- Middle row -->
  <circle cx="160" cy="245" r="33" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="215" cy="235" r="35" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="270" cy="225" r="36" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="325" cy="250" r="32" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />

  <!-- Front foreground mounds -->
  <circle cx="190" cy="265" r="34" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="250" cy="260" r="38" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />
  <circle cx="305" cy="270" r="33" fill="url(#foxnutGrad)" filter="url(#makhanaShadow)" />

  <!-- Peri-Peri Red Paprika & Chili dusting on each foxnut -->
  <g fill="#DC2626" opacity="0.75">
    <!-- Paprika flecks cluster on center makhana -->
    <circle cx="245" cy="250" r="2.5" />
    <circle cx="255" cy="255" r="2" />
    <circle cx="240" cy="265" r="2.2" />
    <circle cx="260" cy="260" r="3" />
    <circle cx="250" cy="275" r="2" />
    <circle cx="268" cy="248" r="2.5" />

    <!-- Left cluster -->
    <circle cx="185" cy="255" r="2.5" />
    <circle cx="195" cy="265" r="2" />
    <circle cx="178" cy="270" r="2.8" />
    <circle cx="205" cy="250" r="2.2" />

    <!-- Right cluster -->
    <circle cx="300" cy="260" r="2.5" />
    <circle cx="312" cy="268" r="2.2" />
    <circle cx="295" cy="275" r="2.8" />
    <circle cx="320" cy="255" r="2" />

    <!-- Background dots -->
    <circle cx="225" cy="220" r="2" />
    <circle cx="280" cy="215" r="2.5" />
    <circle cx="170" cy="235" r="2" />
  </g>

  <!-- Himalayan Rock Salt crystals -->
  <g fill="#FBCFE8" opacity="0.9">
    <rect x="238" y="245" width="3" height="3" transform="rotate(45 238 245)" />
    <rect x="258" y="268" width="3.5" height="3.5" transform="rotate(20 258 268)" />
    <rect x="198" y="258" width="3" height="3" transform="rotate(30 198 258)" />
    <rect x="302" y="252" width="3" height="3" transform="rotate(15 302 252)" />
  </g>

  <!-- Label Badge -->
  <rect x="130" y="420" width="240" height="34" rx="17" fill="#78350F" />
  <text x="250" y="442" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">ROASTED PERI-PERI MAKHANA</text>
</svg>

