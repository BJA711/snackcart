apiVersion: apps/v1
kind: Deployment
metadata:
  name: snackcart-web
  labels:
    app: snackcart
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snackcart
      component: web
  template:
    metadata:
      labels:
        app: snackcart
        component: web
    spec:
      containers:
        - name: snackcart
          image: image-registry.openshift-image-registry.svc:5000/snackcart/snackcart-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: snackcart-config
            - secretRef:
                name: snackcart-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
