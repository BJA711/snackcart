<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <!-- Ceramic Bowl -->
  <ellipse cx="200" cy="270" rx="140" ry="24" fill="#D6D3D1" opacity="0.4" />
  <ellipse cx="200" cy="230" rx="120" ry="70" fill="#E7E5E4" filter="url(#shadow)" />
  <ellipse cx="200" cy="225" rx="114" ry="62" fill="#FAF9F6" />
  <ellipse cx="200" cy="222" rx="100" ry="50" fill="#D97706" opacity="0.15" />
  <!-- Generic Savory/Sweet Snack shapes -->
  <circle cx="165" cy="200" r="28" fill="#F59E0B" filter="url(#shadow)" />
  <circle cx="215" cy="185" r="32" fill="#D97706" filter="url(#shadow)" />
  <circle cx="240" cy="215" r="24" fill="#B45309" filter="url(#shadow)" />
  <circle cx="190" cy="225" r="26" fill="#FBBF24" filter="url(#shadow)" />
  <!-- Garnish flecks -->
  <circle cx="160" cy="195" r="2" fill="#15803D" />
  <circle cx="172" cy="205" r="1.5" fill="#15803D" />
  <circle cx="210" cy="180" r="2" fill="#15803D" />
  <circle cx="225" cy="190" r="1.8" fill="#78350F" />
  <!-- Badge banner -->
  <rect x="110" y="315" width="180" height="28" rx="14" fill="#78350F" />
  <text x="200" y="334" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">SNACKCART HOMEMADE</text>
</svg>

