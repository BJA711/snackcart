<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catSweetsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FDF3E5" />
    </radialGradient>
    <radialGradient id="sweetGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <radialGradient id="sweetAmber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="45%" stop-color="#B45309" />
      <stop offset="85%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>
    <filter id="sweetsSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#catSweetsBg)" />

  <!-- Shadow -->
  <ellipse cx="300" cy="330" rx="210" ry="35" fill="#78350F" opacity="0.12" />

  <!-- Traditional Brass Thali -->
  <ellipse cx="300" cy="235" rx="190" ry="75" fill="#D97706" />
  <ellipse cx="300" cy="230" rx="180" ry="68" fill="#F59E0B" />
  <ellipse cx="300" cy="225" rx="165" ry="60" fill="#FEF3C7" opacity="0.9" />

  <!-- Array of Handcrafted Ladoos & Regional Sweets -->
  <circle cx="210" cy="200" r="42" fill="url(#sweetGold)" filter="url(#sweetsSh)" />
  <ellipse cx="205" cy="180" rx="6" ry="3" fill="#15803D" />

  <circle cx="390" cy="200" r="42" fill="url(#sweetAmber)" filter="url(#sweetsSh)" />
  <ellipse cx="395" cy="180" rx="7" ry="3.5" fill="#FEF3C7" />

  <circle cx="270" cy="170" r="40" fill="url(#sweetAmber)" filter="url(#sweetsSh)" />
  <circle cx="330" cy="170" r="40" fill="url(#sweetGold)" filter="url(#sweetsSh)" />

  <circle cx="260" cy="235" r="46" fill="url(#sweetGold)" filter="url(#sweetsSh)" />
  <ellipse cx="255" cy="210" rx="8" ry="4" fill="#15803D" transform="rotate(-15 255 210)" />
  <ellipse cx="265" cy="214" rx="7" ry="3.5" fill="#FEF08A" transform="rotate(35 265 214)" />

  <circle cx="340" cy="235" r="46" fill="url(#sweetAmber)" filter="url(#sweetsSh)" />
  <ellipse cx="335" cy="210" rx="8" ry="4" fill="#FEF3C7" transform="rotate(20 335 210)" />
  <circle cx="350" cy="218" r="3.5" fill="#FFFFFF" opacity="0.8" />

  <!-- Collection Title -->
  <rect x="180" y="340" width="240" height="32" rx="16" fill="#78350F" />
  <text x="300" y="361" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">ARTISANAL SWEETS</text>
</svg>

