<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catKhakhraBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </radialGradient>
    <radialGradient id="khakhraDisc" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <filter id="crispSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#catKhakhraBg)" />

  <!-- Shadow -->
  <ellipse cx="300" cy="330" rx="220" ry="35" fill="#78350F" opacity="0.12" />

  <!-- Stack of Khakhras & Chaklis -->
  <!-- Back Khakhra -->
  <circle cx="260" cy="180" r="115" fill="#B45309" opacity="0.6" filter="url(#crispSh)" />
  <!-- Middle Khakhra -->
  <circle cx="330" cy="190" r="120" fill="#D97706" opacity="0.85" filter="url(#crispSh)" />
  <!-- Front Khakhra -->
  <circle cx="280" cy="210" r="125" fill="url(#khakhraDisc)" filter="url(#crispSh)" stroke="#92400E" stroke-width="2" />

  <!-- Roasted spots & Fenugreek -->
  <g fill="#78350F" opacity="0.6">
    <ellipse cx="250" cy="180" rx="12" ry="7" transform="rotate(-15 250 180)" />
    <ellipse cx="310" cy="200" rx="15" ry="8" transform="rotate(25 310 200)" />
    <ellipse cx="270" cy="240" rx="16" ry="8" />
    <ellipse cx="330" cy="250" rx="12" ry="6" transform="rotate(-20 330 250)" />
    <circle cx="220" cy="220" r="5" />
    <circle cx="300" cy="270" r="6" />
  </g>
  <g fill="#166534" opacity="0.8">
    <path d="M 230 190 C 235 185, 245 188, 240 195 Z" />
    <path d="M 290 220 C 295 215, 305 218, 300 225 Z" />
    <path d="M 260 250 C 265 245, 275 248, 270 255 Z" />
    <circle cx="320" cy="230" r="2.5" />
    <circle cx="240" cy="230" r="2.5" />
  </g>

  <!-- Side Chakli disc for collection variety -->
  <g transform="translate(430, 230) rotate(20)" filter="url(#crispSh)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#92400E" stroke-width="12" stroke-dasharray="5,3" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#D97706" stroke-width="12" stroke-dasharray="5,3" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F59E0B" stroke-width="10" stroke-dasharray="4,2" />
    <circle cx="0" cy="0" r="5" fill="#78350F" />
  </g>

  <!-- Collection Title -->
  <rect x="180" y="340" width="240" height="32" rx="16" fill="#78350F" />
  <text x="300" y="361" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">KHAKHRA &amp; CRISPS</text>
</svg>

